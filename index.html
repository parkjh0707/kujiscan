<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1530">
<link rel="preconnect" href="https://api.anthropic.com">
<title>쿠지스캔 v2.2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{--bg:#f6f2ee;--card:#fff;--ink:#231c33;--mute:#7a7088;--line:#e4dcd4;--top:#e5483b;--low:#2f6fd6;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1530;--card:#251e42;--ink:#f3eefc;--mute:#a79cc4;--line:#3a3160;--top:#ff7a6b;--low:#7db4ff;--on:#1a1530}}
:root[data-theme="dark"]{--bg:#1a1530;--card:#251e42;--ink:#f3eefc;--mute:#a79cc4;--line:#3a3160;--top:#ff7a6b;--low:#7db4ff;--on:#1a1530}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Noto Sans KR","Apple SD Gothic Neo",sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font:400 30px/1.1 "Do Hyeon","Noto Sans KR",sans-serif;margin:8px 0 4px}
.ver{font:700 13px "Noto Sans KR",sans-serif;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 6px;vertical-align:middle}
.sub{color:var(--mute);margin:0 0 20px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font:400 20px "Do Hyeon","Noto Sans KR",sans-serif;margin:0 0 4px}
.hint{font-size:13px;color:var(--mute);margin:0 0 10px}
button{font:700 15px "Noto Sans KR",sans-serif;border:0;border-radius:10px;padding:12px 16px;background:var(--ink);color:var(--bg);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,.chip:focus-visible,.drop:focus-within{outline:3px solid var(--low);outline-offset:2px}
/* 홈 */
.kind{display:block;width:100%;text-align:left;padding:18px 16px;margin-bottom:12px;border-radius:14px;background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.kind b{display:block;font:400 24px "Do Hyeon",sans-serif}
.kind span{font:400 13px "Noto Sans KR",sans-serif;color:var(--mute)}
.kind:not(:disabled):hover{border-color:var(--top)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.icon{width:44px;height:44px;padding:0;border-radius:12px;background:transparent;color:var(--ink);border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
/* 분석 */
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:28px 12px;text-align:center;color:var(--mute);cursor:pointer}
.drop img{max-width:100%;max-height:260px;border-radius:8px;display:block;margin:0 auto}
.drop input{display:none}
.go{width:100%;margin-top:12px}
.acc{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px;color:var(--mute)}
.msg{min-height:22px;margin:8px 0 0;font-size:14px;color:var(--mute)}
.msg.err{color:var(--top)}
details.card summary{font-weight:700;cursor:pointer}
input[type=password]{width:100%;padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
.keybtns{display:flex;gap:8px}.keybtns button{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:44px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:400 20px "Do Hyeon",sans-serif}
.chip.on{background:var(--top);border-color:var(--top);color:var(--on)}
.big{text-align:center;padding:8px 0 4px}
.big b{display:block;font:400 76px/1 "Do Hyeon",sans-serif;color:var(--top)}
.big span{color:var(--mute);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:12px}
.stats div{border:1px solid var(--line);border-radius:10px;padding:10px 4px}
.stats b{display:block;font:400 26px/1.1 "Do Hyeon",sans-serif}
.stats span{font-size:12px;color:var(--mute)}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.lt{font:400 24px "Do Hyeon",sans-serif}
.top .lt{color:var(--top)}.low .lt{color:var(--low)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;transition:width .25s}
.top .bar i{background:var(--top)}.low .bar i{background:var(--low)}
.meta{font-size:12px;color:var(--mute)}
.warn{color:var(--top);font-weight:700}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;padding:0;font-size:18px;background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.step output{min-width:22px;text-align:center;font-weight:700}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<header class="top">
  <h1>쿠지 스캐너 <small class="ver">v2.2</small></h1>
  <button class="icon" id="homeBtn" aria-label="홈으로" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>
  </button>
</header>

<details class="card" id="keybox">
  <summary>API 키 설정</summary>
  <p class="hint">키는 이 폰의 브라우저에만 저장돼요. 코드나 GitHub에는 절대 넣지 마세요.</p>
  <input type="password" id="key" placeholder="sk-ant-..." autocomplete="off" autocapitalize="off">
  <div class="keybtns"><button id="saveKey">저장</button><button id="delKey">삭제</button></div>
</details>

<!-- 홈 -->
<section id="home">
  <p class="sub">어떤 쿠지를 분석할까요?</p>
  <button class="kind" data-go="ichiban"><b>제일복권</b><span>일번쿠지 · 등수 알파벳이 찍힌 스텁을 붙이는 판</span></button>
  <button class="kind" data-go="jache"><b>자체쿠지</b><span>가게가 직접 만든 판 · 스티커, 번호 라벨, 알파벳 스텁</span></button>
</section>

<!-- 제일복권 -->
<section id="scan" hidden>
  <h2 id="scanTitle"></h2>
  <p class="sub">회수 부착표를 찍으면 남은 상품과 확률을 계산해요.</p>
  <div class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*" capture="environment">
      <span id="dropText">회수 부착표 사진 찍기 · 선택하기</span>
    </label>
    <button class="go" id="go" disabled>사진 분석하기</button>
    <label class="acc"><input type="checkbox" id="acc"> 정밀 모드 (Sonnet · 느리지만 더 정확)</label>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </div>
  <div id="out"></div>
</section>
</main>

<script>
const S={tiers:[],cut:-1,imgs:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const say=(t,err)=>{$("msg").textContent=t;$("msg").className="msg"+(err?" err":"")};
const MODEL_FAST="claude-haiku-5-5",MODEL_ACC="claude-sonnet-5-5"; // 모델명이 바뀌면 여기만 수정
const LASTRE=/라스트|ラスト|last|^LO$/i;

/* ---------- 화면 전환 ---------- */
let MODE="ichiban";
function show(v){$("home").hidden=v!=="home";$("scan").hidden=v==="home";$("homeBtn").hidden=v==="home";window.scrollTo(0,0)}
function reset(){
  S.tiers=[];S.cut=-1;S.imgs=[];$("out").innerHTML="";
  $("dropText").textContent="회수 부착표 사진 찍기 · 선택하기";
  $("go").disabled=true;say("");
}
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{reset();MODE=b.dataset.go;$("scanTitle").textContent=CFG[MODE].title;show("scan")}));
$("homeBtn").addEventListener("click",()=>{reset();show("home")});

/* ---------- API 키 ---------- */
const getKey=()=>{try{return localStorage.getItem("kuji_key")||""}catch(_){return ""}};
if(!getKey())$("keybox").open=true;
$("saveKey").addEventListener("click",()=>{
  const v=$("key").value.trim();if(!v)return;
  try{localStorage.setItem("kuji_key",v);$("key").value="";$("keybox").open=false}
  catch(_){say("이 브라우저에서는 키를 저장할 수 없어요.",true)}
});
$("delKey").addEventListener("click",()=>{try{localStorage.removeItem("kuji_key")}catch(_){}$("keybox").open=true});

/* ---------- 사진 ---------- */
// 전체 사진(이미지 1) + 아래쪽 60% 확대(이미지 2): 작은 라벨을 더 또렷하게 보내기 위함
async function prepare(file){
  const b=await createImageBitmap(file);
  const toBlob=c=>new Promise(r=>c.toBlob(r,"image/jpeg",.8));
  const cv=(sx,sy,sw,sh,k)=>{const c=document.createElement("canvas");c.width=Math.round(sw*k);c.height=Math.round(sh*k);
    c.getContext("2d").drawImage(b,sx,sy,sw,sh,0,0,c.width,c.height);return c};
  const k1=Math.min(1,1568/Math.max(b.width,b.height));
  const sy=Math.round(b.height*0.4),sh=b.height-sy;
  const k2=Math.min(2,1568/Math.max(b.width,sh));
  return Promise.all([toBlob(cv(0,0,b.width,b.height,k1)),toBlob(cv(0,sy,b.width,sh,k2))]);
}
const toB64=b=>new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(String(f.result).split(",")[1]);f.onerror=no;f.readAsDataURL(b)});

$("file").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  S.tiers=[];S.cut=-1;$("out").innerHTML="";say("");
  try{
    S.imgs=await prepare(f);
    $("dropText").innerHTML='<img alt="촬영한 회수 부착표" src="'+URL.createObjectURL(S.imgs[0])+'">';
    $("go").disabled=false;$("go").click();
  }catch(_){say("사진을 읽지 못했어요. 다른 사진으로 다시 시도해 주세요.",true)}
});

/* ---------- 제일복권 인식 ---------- */
const PROMPT_ICHIBAN=`이 사진은 일번쿠지(一番くじ, 제일복권)의 회수 부착표입니다. 이미지가 두 장 주어집니다. 이미지 1은 사진 전체, 이미지 2는 같은 사진의 아래쪽 60%를 확대한 것입니다. 작은 "あと N枚" 라벨은 이미지 2에서 확인하세요.
이 판의 규칙:
- 등수(A, B, C…)마다 티켓 한 장당 칸이 하나씩 있고, 칸마다 "あと N枚"(N장 남음) 라벨이 인쇄되어 있습니다.
- 티켓이 팔리면 그 등수의 알파벳(A, B, E 등)이 큼직하게 찍힌 검은 스텁이 칸 위에 붙어 라벨을 가립니다. 스텁에는 반드시 그 등수의 알파벳이 있으니, 스텁의 글자로 등수를 구분하세요.
- 스텁이 가리지 않은 칸이 아직 안 팔린 티켓입니다.
- 한 등수가 모두 팔리면 사장님이 빨간(또는 주황) "終了" 스티커를 그 등수 쪽에 붙이기도 합니다.
- 아래쪽의 E, F, G, H… 같은 등수는 보통 세로 열 하나가 한 등수입니다. 열 왼쪽·위에 스텁이 쌓여 있고, 그 오른쪽과 아래에 라벨 칸이 이어집니다. 한 등수의 라벨이 스텁 줄 아래쪽에 따로 이어지는 경우가 많으니 열을 끝까지 내려가며 확인하고, 옆 열의 라벨과 섞지 마세요.
먼저 all_tiers에 보드에 보이는 모든 등수 글자를 위에서 아래, 왼쪽에서 오른쪽 순서로 빠짐없이 적으세요(라스트원 제외). 그다음 all_tiers의 모든 등수마다 tiers에 항목을 하나씩 만드세요.
각 등수 항목:
- stubs: 그 등수 알파벳이 찍혀 붙어 있는 스텁 개수. 겹쳐 있어도 글자를 하나씩 세세요. 없으면 0
- blocks: 스텁에 가려지지 않고 보이는 "あと N枚" 라벨을, 숫자가 연달아 이어지는 덩어리마다 {hi, lo}(가장 큰 N, 가장 작은 N)로 적으세요. 한 등수의 라벨이 여러 덩어리로 나뉘어 있을 수 있으니 모두 적으세요. 보이는 라벨이 없으면 빈 배열
- open_slots: 스텁에 덮이지 않은 칸이 하나라도 보이면 true
- ended: 그 등수에 빨간 終了 스티커가 붙어 있으면 true
규칙:
- 예: E에 あと6枚~1枚 덩어리와, 그 아래 다른 곳에 あと10枚~7枚 덩어리가 보이면 blocks는 [{"hi":6,"lo":1},{"hi":10,"lo":7}]입니다. 남은 수량은 가장 큰 N(여기서는 10)이 됩니다.
- 보이는 라벨 숫자는 1부터 N까지 빠짐없이 이어지는 것이 정상입니다. 빠진 구간이 있으면 그 번호의 덩어리를 다시 찾아보세요.
- A, B, D처럼 큰 글자 옆에 "あと2枚", "あと1枚"가 따로 적힌 등수도 같은 규칙입니다. あと2枚와 あと1枚가 모두 보이면 [{"hi":2,"lo":1}], 스텁이 위 칸을 덮고 あと1枚만 보이면 [{"hi":1,"lo":1}].
- 스텁이 모든 칸을 덮어 라벨이 전혀 안 보이면 blocks는 빈 배열, open_slots는 false입니다(전부 팔림). 그 등수도 목록에 포함하세요.
- 라벨이 작아 숫자를 못 읽어도 덮이지 않은 칸이 보이면 open_slots를 true로 하고 blocks는 빈 배열로 두세요.
- 펜으로 손으로 쓴 글씨(번호 범위, 가격, 메모)와 옆 포스터(다른 쿠지)는 무시하세요. 표 바깥 안내 문구 옆의 큰 빨간 終了는 세지 마세요.
결과는 report 도구로 제출하세요.`;

const TOOL_ICHIBAN={name:"report",description:"등수별 남은 칸 정보를 제출한다",input_schema:{type:"object",
  properties:{all_tiers:{type:"array",items:{type:"string"}},
  tiers:{type:"array",items:{type:"object",properties:{id:{type:"string"},stubs:{type:"integer"},
    blocks:{type:"array",items:{type:"object",properties:{hi:{type:"integer"},lo:{type:"integer"}},required:["hi","lo"]}},
    open_slots:{type:"boolean"},ended:{type:"boolean"}},required:["id","stubs","blocks","open_slots","ended"]}}},
  required:["all_tiers","tiers"]}};

async function askClaude(key,imgs,prompt,tool){
  const b64s=await Promise.all(imgs.map(toB64));
  const model=$("acc").checked?MODEL_ACC:MODEL_FAST;
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),40000);
  const t0=Date.now(),tick=setInterval(()=>say("분석하는 중이에요… "+Math.round((Date.now()-t0)/1000)+"초"),500);
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",signal:ctl.signal,
      headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model,max_tokens:1500,tools:[tool],tool_choice:{type:"tool",name:tool.name},
        messages:[{role:"user",content:[...b64s.map(data=>({type:"image",source:{type:"base64",media_type:"image/jpeg",data}})),{type:"text",text:prompt}]}]})
    });
    if(!res.ok){
      let m="";try{m=(await res.json()).error.message}catch(_){}
      if(res.status===401)throw new Error("API 키가 올바르지 않아요");
      if(res.status===429)throw new Error("요청이 너무 많아요. 잠시 후 다시 시도해 주세요");
      if(res.status===529)throw new Error("서버가 바빠요. 잠시 후 다시 시도해 주세요");
      throw new Error("["+model+"] "+(m||("오류 "+res.status)));
    }
    const d=await res.json();
    const tu=(d.content||[]).find(c=>c.type==="tool_use");
    if(!tu||!tu.input||!Array.isArray(tu.input.tiers)){
      const txt=(d.content||[]).map(c=>c.text||"").join("").slice(0,80);
      throw new Error("결과를 읽지 못했어요 ("+(d.stop_reason||"?")+") "+txt);
    }
    say("분석 완료 ("+model+" · "+((Date.now()-t0)/1000).toFixed(1)+"초). 숫자가 틀렸다면 아래에서 고칠 수 있어요.");
    return tu.input;
  }catch(e){
    if(e.name==="AbortError")throw new Error("40초가 지나 중단했어요. 다시 시도해 주세요");
    throw e;
  }finally{clearTimeout(timer);clearInterval(tick)}
}

function parseIchiban(r){
  const t=(r.tiers||[]).map(x=>{
    const bl=(x.blocks||[]).map(b=>({hi:Number(b.hi),lo:Number(b.lo)})).filter(b=>b.hi>0&&b.lo>0&&b.hi>=b.lo);
    let rem=0,warn="";
    if(bl.length){
      rem=Math.max(...bl.map(b=>b.hi));
      const cov=new Set();bl.forEach(b=>{for(let n=b.lo;n<=b.hi;n++)cov.add(n)});
      const gap=[];for(let n=1;n<=rem;n++)if(!cov.has(n))gap.push(n);
      if(gap.length)warn="번호가 이어지지 않아요 (빠진 칸: "+gap.slice(0,6).join(", ")+(gap.length>6?"…":"")+")";
    }else rem=x.open_slots?1:0;
    if(x.ended&&rem>0)warn=(warn?warn+" · ":"")+"終了 스티커가 있는데 빈 칸이 보여요 (종류별 종료일 수 있어요)";
    return{id:String(x.id),remaining:rem,info:Number.isFinite(+x.stubs)?"스텁 "+(+x.stubs)+"개 확인":"",warn};
  }).filter(x=>!LASTRE.test(x.id));
  const order=(r.all_tiers||[]).map(String).filter(id=>!LASTRE.test(id));
  const miss=order.filter(id=>!t.some(x=>x.id===id));
  miss.forEach(id=>t.push({id,remaining:0,info:"",warn:"읽지 못했어요. + − 로 직접 입력해 주세요"}));
  if(order.length)t.sort((a,b)=>{const i=order.indexOf(a.id),j=order.indexOf(b.id);return (i<0?99:i)-(j<0?99:j)});
  return t;
}

const PROMPT_JACHE=`이 사진은 쿠지 가게의 회수 부착표입니다(가게가 직접 운영하는 자체쿠지 판). 이미지가 두 장 주어집니다. 이미지 1은 사진 전체, 이미지 2는 같은 사진의 아래쪽 60%를 확대한 것입니다. 작은 번호와 스티커는 이미지 2에서 확인하세요.
구조:
- 등수(A, B, C…)마다 티켓 한 장당 칸이 하나씩 있고, 칸에는 번호가 인쇄되어 있습니다("1", "2", "1枚目", "あと N枚" 등).
- 티켓이 팔리면 사장님이 칸 위에 스티커를 붙여 칸을 가립니다. 스티커 종류는 판마다 다릅니다: 빨간 終了 스티커, 팔린 티켓 번호를 손으로 쓴 흰 라벨(예: 27, 44, 80), 등수 알파벳이 찍힌 검은 스텁. 어떤 종류든 "팔린 칸 1개"입니다. 스텁을 칸 위가 아니라 별도 줄에 쌓아 두는 판도 있는데, 그 경우 스텁 줄은 칸을 가리지 않으니 stickers에 세지 말고 인쇄된 번호 칸만 읽으세요.
- 번호가 큰 칸부터 가리는 가게도 있고 작은 칸부터 가리는 가게도 있습니다. 그래서 가려진 칸이 아니라 "가려지지 않은 칸"과 "스티커 개수"를 읽어야 합니다.
- 등수 글자 근처에 사장님이 펜으로 쓴 "티켓 번호 범위"(예: "10-33", "3", "8~25")가 있는 판이 많습니다. 이 범위의 양 끝이 그 등수 전체 티켓의 번호입니다.
먼저 all_tiers에 보드에 보이는 모든 등수 글자를 위에서 아래, 왼쪽에서 오른쪽 순서로 빠짐없이 적으세요(라스트원 제외). 그다음 all_tiers의 모든 등수마다 tiers에 항목을 하나씩 만드세요.
각 등수 항목:
- written_lo, written_hi: 그 등수의 손글씨 티켓 번호 범위의 양 끝. 숫자 하나면 둘 다 같은 값. 범위가 없거나 읽을 수 없으면 둘 다 null
- stickers: 그 등수의 칸 위에 붙은 스티커 개수(빨간 終了, 번호 라벨, 알파벳 스텁 모두 포함). 겹쳐 붙은 라벨도 하나씩 세세요. 없으면 0
- open_lo, open_hi: 스티커로 가려지지 않고 보이는 칸의 "인쇄된 칸 번호" 중 가장 작은 번호와 가장 큰 번호(칸이 여러 줄이나 블록에 걸쳐 있으면 전체에서). 스티커에 손으로 쓴 번호와 손글씨 범위는 칸 번호가 아닙니다. 보이는 칸이 없으면 둘 다 null
- open_slots: 가려지지 않은 칸이 하나라도 보이면 true
예시:
- F: 손글씨가 "10-33", 윗줄 칸 1~12 중 1~3번이 흰 라벨 3장으로 덮이고 4~12번과 아랫줄 13~24번이 보이면 written_lo 10, written_hi 33, stickers 3, open_lo 4, open_hi 24.
- B: 손글씨가 "3"이고 칸 1개가 비어 있으면 written_lo 3, written_hi 3, stickers 0, open_lo 1, open_hi 1.
- 칸이 모두 가려졌으면 open_lo와 open_hi는 null, open_slots는 false.
- "あと N枚" 방식 판은 보이는 칸의 N 중 가장 작은 값과 가장 큰 값을 open_lo, open_hi로 쓰세요.
- 한 줄에 칸이 이어지다 다른 줄로 넘어가는 경우(예: 윗줄 1~12, 아랫줄 13~24)에도 전체 범위로 적으세요.
- 옆 포스터(다른 쿠지)는 무시하세요. 표 바깥 안내 문구 옆의 큰 빨간 終了는 세지 마세요.
결과는 report 도구로 제출하세요.`;

const TOOL_JACHE={name:"report",description:"등수별 티켓 범위, 스티커 개수, 빈 칸 범위를 제출한다",input_schema:{type:"object",
  properties:{all_tiers:{type:"array",items:{type:"string"}},
  tiers:{type:"array",items:{type:"object",properties:{id:{type:"string"},
    written_lo:{type:["integer","null"]},written_hi:{type:["integer","null"]},
    stickers:{type:"integer"},
    open_lo:{type:["integer","null"]},open_hi:{type:["integer","null"]},
    open_slots:{type:"boolean"}},required:["id","written_lo","written_hi","stickers","open_lo","open_hi","open_slots"]}}},
  required:["all_tiers","tiers"]}};

// 남은 수량 = (손글씨 범위의 전체 − 스티커 수) 와 (빈 칸 번호 범위) 두 가지로 계산해 서로 확인
function parseJache(r){
  const t=(r.tiers||[]).map(x=>{
    const wl=Number(x.written_lo),wh=Number(x.written_hi),ol=Number(x.open_lo),oh=Number(x.open_hi);
    const st=Number.isFinite(Number(x.stickers))?Number(x.stickers):null;
    const total=(wl>0&&wh>=wl)?wh-wl+1:null;
    const e1=(ol>0&&oh>=ol)?oh-ol+1:null;                          // 보이는 칸 번호 기준
    const e2=(total!==null&&st!==null&&st<=total)?total-st:null;   // 전체 − 스티커 기준
    let rem,warn="";
    if(e1!==null&&e2!==null){
      if(Math.abs(e1-e2)<=1)rem=e2;   // 1 차이는 판에 쓰이지 않는 칸이 남는 경우가 있어 손글씨 범위를 우선
      else{rem=e1;warn="서로 달라요 (빈 칸 번호 기준 "+e1+" / 전체−스티커 기준 "+e2+")"}
    }else if(e2!==null)rem=e2;
    else if(e1!==null)rem=e1;
    else rem=x.open_slots?1:0;
    const parts=[];
    if(total!==null)parts.push("전체 "+total);
    if(st!==null)parts.push("스티커 "+st+"개");
    if(e1!==null)parts.push("빈 칸 "+ol+"~"+oh);
    return{id:String(x.id),remaining:rem,info:parts.join(" · "),warn};
  }).filter(x=>!LASTRE.test(x.id));
  const order=(r.all_tiers||[]).map(String).filter(id=>!LASTRE.test(id));
  const miss=order.filter(id=>!t.some(x=>x.id===id));
  miss.forEach(id=>t.push({id,remaining:0,info:"",warn:"읽지 못했어요. + − 로 직접 입력해 주세요"}));
  if(order.length)t.sort((a,b)=>{const i=order.indexOf(a.id),j=order.indexOf(b.id);return (i<0?99:i)-(j<0?99:j)});
  return t;
}

const CFG={
  ichiban:{title:"제일복권 분석",prompt:PROMPT_ICHIBAN,tool:TOOL_ICHIBAN,parse:parseIchiban},
  jache:{title:"자체쿠지 분석",prompt:PROMPT_JACHE,tool:TOOL_JACHE,parse:parseJache}
};

$("go").addEventListener("click",async()=>{
  $("go").disabled=true;S.tiers=[];S.cut=-1;$("out").innerHTML="";say("분석하는 중이에요…");
  try{
    const key=getKey();
    if(!key){$("keybox").open=true;say("먼저 위에서 API 키를 저장해 주세요.",true);return}
    const cfg=CFG[MODE];
    const r=await askClaude(key,S.imgs,cfg.prompt,cfg.tool);
    const t=cfg.parse(r);
    if(!t.length){say("등수를 찾지 못했어요. 부착표 전체가 보이게 다시 찍어 보세요.",true);return}
    S.tiers=t;S.cut=-1;render();
  }catch(e){say("분석에 실패했어요: "+(e&&e.message||"다시 시도해 주세요"),true)}
  finally{$("go").disabled=false}
});

/* ---------- 결과 화면 ---------- */
function render(){
  const T=S.tiers,cut=S.cut,sum=a=>a.reduce((s,t)=>s+t.remaining,0),rem=sum(T);
  let h='<section class="card"><h2>상위상은 어디까지?</h2><p class="hint">고른 등수까지 상위상으로 계산해요.</p><div class="chips">'+
    T.map((t,i)=>'<button class="chip'+(i===cut?" on":"")+'" data-cut="'+i+'">'+esc(t.id)+'</button>').join("")+'</div></section>';
  if(cut>=0){
    const rt=sum(T.slice(0,cut+1)),rl=rem-rt,p=rem?rt/rem*100:0;
    h+='<section class="card"><div class="big"><b>'+p.toFixed(1)+'%</b><span>다음 한 장에서 상위상('+esc(T[0].id)+'~'+esc(T[cut].id)+')이 나올 확률</span></div>'+
      '<div class="stats"><div><b>'+rem+'</b><span>남은 수량</span></div><div><b style="color:var(--top)">'+rt+'</b><span>상위상 남음</span></div><div><b style="color:var(--low)">'+rl+'</b><span>하위상 남음</span></div></div></section>';
  }
  h+='<section class="card"><h2>등수별 남은 수량</h2><p class="hint">읽은 값이 틀리면 + − 로 고치세요.</p>'+
    T.map((t,i)=>{
      const pc=rem?t.remaining/rem*100:0,cls=cut>=0&&i>cut?"low":"top";
      return '<div class="row '+cls+'"><div class="lt">'+esc(t.id)+'</div><div><div class="bar"><i style="width:'+pc+'%"></i></div>'+
        '<div class="meta">남은 '+t.remaining+'장 · 한 장 뽑을 때 '+pc.toFixed(1)+'%'+(t.info?' · '+esc(t.info):'')+(t.warn?'<br><span class="warn">⚠ '+esc(t.warn)+'</span>':'')+'</div></div>'+
        '<div class="step"><button data-i="'+i+'" data-d="-1" aria-label="'+esc(t.id)+' 하나 줄이기">−</button><output>'+t.remaining+'</output><button data-i="'+i+'" data-d="1" aria-label="'+esc(t.id)+' 하나 늘리기">+</button></div></div>';
    }).join("")+'</section>';
  $("out").innerHTML=h;
}
$("out").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.cut!==undefined){S.cut=+b.dataset.cut}
  else if(b.dataset.i!==undefined){const t=S.tiers[+b.dataset.i];t.remaining=Math.max(0,t.remaining+ +b.dataset.d)}
  render();
});
</script>
