<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1530">
<link rel="preconnect" href="https://api.anthropic.com">
<title>쿠지스캔 v2.7</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{--bg:#f6f2ee;--card:#fff;--ink:#231c33;--mute:#7a7088;--line:#e4dcd4;--top:#e5483b;--low:#2f6fd6;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1530;--card:#251e42;--ink:#f3eefc;--mute:#a79cc4;--line:#3a3160;--top:#ff7a6b;--low:#7db4ff;--on:#1a1530}}
:root[data-theme="dark"]{--bg:#1a1530;--card:#251e42;--ink:#f3eefc;--mute:#a79cc4;--line:#3a3160;--top:#ff7a6b;--low:#7db4ff;--on:#1a1530}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#0b0a14;color:var(--ink);font:400 16px/1.5 "Noto Sans KR","Apple SD Gothic Neo",sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font:400 30px/1.1 "Do Hyeon","Noto Sans KR",sans-serif;margin:8px 0 4px}
.ver{font:700 13px "Noto Sans KR",sans-serif;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 6px;vertical-align:middle}
.sub{color:var(--mute);margin:0 0 20px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font:400 20px "Do Hyeon","Noto Sans KR",sans-serif;margin:0 0 4px}
.hint{font-size:13px;color:var(--mute);margin:0 0 10px}
button{font:700 15px "Noto Sans KR",sans-serif;border:0;border-radius:10px;padding:12px 16px;background:var(--ink);color:var(--bg);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,.chip:focus-visible,.drop:focus-within{outline:3px solid var(--low);outline-offset:2px}
/* 홈 */
.kind{display:block;width:100%;text-align:left;padding:18px 16px;margin-bottom:12px;border-radius:14px;background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.kind b{display:block;font:400 24px "Do Hyeon",sans-serif}
.kind span{font:400 13px "Noto Sans KR",sans-serif;color:var(--mute)}
.kind:not(:disabled):hover{border-color:var(--top)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.icon{width:44px;height:44px;padding:0;border-radius:12px;background:transparent;color:var(--ink);border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
/* 분석 */
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:28px 12px;text-align:center;color:var(--mute);cursor:pointer}
.drop img{max-width:100%;max-height:260px;border-radius:8px;display:block;margin:0 auto}
.drop input{display:none}
.go{width:100%;margin-top:12px}
.acc{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px;color:var(--mute)}
.msg{min-height:22px;margin:8px 0 0;font-size:14px;color:var(--mute)}
.msg.err{color:var(--top)}
details.card summary{font-weight:700;cursor:pointer}
input[type=password]{width:100%;padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
.keybtns{display:flex;gap:8px}.keybtns button{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:44px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:400 20px "Do Hyeon",sans-serif}
.chip.on{background:var(--top);border-color:var(--top);color:var(--on)}
.big{text-align:center;padding:8px 0 4px}
.big b{display:block;font:400 76px/1 "Do Hyeon",sans-serif;color:var(--top)}
.big span{color:var(--mute);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:12px}
.stats div{border:1px solid var(--line);border-radius:10px;padding:10px 4px}
.stats b{display:block;font:400 26px/1.1 "Do Hyeon",sans-serif}
.stats span{font-size:12px;color:var(--mute)}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.lt{font:400 24px "Do Hyeon",sans-serif}
.top .lt{color:var(--top)}.low .lt{color:var(--low)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;transition:width .25s}
.top .bar i{background:var(--top)}.low .bar i{background:var(--low)}
.meta{font-size:12px;color:var(--mute)}
.warn{color:var(--top);font-weight:700}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;padding:0;font-size:18px;background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.step output{min-width:22px;text-align:center;font-weight:700}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
/* 배경 슬라이드 */
.bg{position:fixed;inset:0;z-index:-2;background:#0b0a14}
.bg i{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease-in-out}
.bg i.on{opacity:1}
.bgshade{position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(10,8,22,.55),rgba(10,8,22,.35) 40%,rgba(10,8,22,.6))}
.top h1,.sub,#scanTitle{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.ver{color:#e8e2f7;border-color:rgba(255,255,255,.45)}
.icon{background:rgba(20,16,40,.55);color:#fff;border-color:rgba(255,255,255,.4);backdrop-filter:blur(6px)}
@media (prefers-reduced-motion:reduce){.bg i{transition:none}}
/* ===== 오늘의 운세 ===== */
.kind:focus-visible{outline:3px solid var(--low);outline-offset:2px}
.linkbtn{background:none;color:#cfc7e6;padding:8px 4px;font:400 12px "Noto Sans KR",sans-serif;text-decoration:underline;margin-top:8px}
.glass{background:rgba(20,16,40,.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:16px;color:#fff}
.glass h2{color:#fff}
.hint2{font-size:13px;color:#cfc7e6;margin:2px 0 12px}
.fcount{text-align:center;margin-top:18px}
.cnt{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 18px}
.cnt output{min-width:44px;font:400 44px/1 "Do Hyeon",sans-serif}
.pm{width:48px;height:48px;border-radius:50%;padding:0;font-size:24px;background:#4452d6;color:#fff}
.qbtn{min-width:44px;height:44px;border-radius:22px;padding:0 12px;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5)}
.ok{display:block;width:100%;padding:14px;font-size:17px;border-radius:14px;background:linear-gradient(#e8e23a,#b8b312);color:#262300;box-shadow:0 3px 0 #7d7a0a}
.ok:disabled{background:#6b6a55;color:#bdbba5;box-shadow:none;opacity:1}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:6px;z-index:5;margin-bottom:12px;font-size:14px;border-color:rgba(214,120,255,.7)}
.rnd{background:#4452d6;color:#fff;padding:10px 14px;border-radius:12px;flex:none}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding-bottom:84px}
.tk{position:relative;aspect-ratio:1.5/1;border:0;padding:0;border-radius:6px;background:linear-gradient(#ffa042,#ee6f18);box-shadow:0 2px 0 #a8460a,0 3px 6px rgba(0,0,0,.45);cursor:pointer;color:inherit;transition:transform .12s,box-shadow .12s}
.tk::before{content:"➤";position:absolute;left:5%;top:14%;bottom:14%;width:21%;background:#fff;border-radius:60% 4px 4px 60%;display:grid;place-items:center;font-size:9px;color:#3340d8}
.tk::after{content:"";position:absolute;left:32%;right:8%;bottom:16%;height:30%;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px);opacity:.9}
.tk i{display:none;position:absolute;right:-5px;top:-7px;width:18px;height:18px;border-radius:50%;background:#2fd37a;color:#05331a;font:700 12px/18px sans-serif;text-align:center;font-style:normal;z-index:2}
.tk.sel{outline:3px solid #3ddc84;box-shadow:0 0 14px 3px rgba(61,220,132,.95),0 3px 6px rgba(0,0,0,.45);transform:translateY(-2px) scale(1.07);z-index:1}
.tk.sel i{display:block}
.tk:focus-visible{outline:3px solid #fff;outline-offset:2px}
.startbar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(10,8,22,.85) 35%);z-index:6}
.startbar .ok{max-width:488px;margin:0 auto}
.otop{text-align:center;margin-top:14px}
.otop b{display:block;font:400 22px "Do Hyeon",sans-serif}
.otop span{font-size:13px;color:#cfc7e6}
/* 뜯기 */
.pk{position:relative;width:min(88vw,360px);aspect-ratio:1.62/1;margin:26px auto 10px;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}
.pk-under,.pk-wrap,.pk-face{position:absolute;inset:0;border-radius:16px}
.pk-under{background:#f08a1c;box-shadow:0 8px 22px rgba(0,0,0,.55)}
.pk-inner{position:absolute;inset:9px;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 60%,#4a4a3a,#1b1b1b 75%)}
.stripe{position:absolute;left:0;right:0;top:0;height:20%;background:linear-gradient(#2d34a8 0 40%,#fff 40% 68%,#2d34a8 68%)}
.glow{position:absolute;left:50%;top:58%;width:10px;height:10px;border-radius:50%;opacity:0;transform:translate(-50%,-50%)}
.letter{position:absolute;inset:20% 0 0 0;display:grid;place-items:center;font:400 clamp(70px,24vw,110px)/1 "Do Hyeon",sans-serif;opacity:0;transform:scale(.4)}
.letter small{font-size:.38em;margin-left:2px;align-self:end;padding-bottom:.2em}
.letter{grid-auto-flow:column;justify-content:center;align-content:center}
.t1 .letter{color:#ffd84a;text-shadow:0 0 18px #ff7a1a,0 0 36px #ff3d00,0 3px 0 #a05a00}
.t2 .letter{color:#cdb8ff;text-shadow:0 0 14px #7a5cff,0 3px 0 #3a2a8f}
.t3 .letter{color:#f4ea60;text-shadow:0 0 10px #8c8400,0 3px 0 #6b6400}
.pk.done .letter{animation:pop .55s cubic-bezier(.2,1.5,.4,1) forwards}
.pk.done.t1 .glow{animation:burst 1s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes burst{0%{opacity:.95;width:10px;height:10px;box-shadow:0 0 0 0 rgba(255,140,30,.9),0 0 30px 10px rgba(255,90,0,.8)}100%{opacity:0;width:240px;height:240px;box-shadow:0 0 60px 20px rgba(255,140,30,0)}}
.pk-wrap{filter:drop-shadow(-3px 2px 4px rgba(0,0,0,.55));pointer-events:none}
.pk-face{background:linear-gradient(135deg,#ffa447,#ee6a14);border:3px solid #ffbf80;display:grid;place-items:center;overflow:hidden}
.pk-face::before{content:"";position:absolute;inset:7px;border:2px solid rgba(255,255,255,.7);border-radius:11px}
.brand{font:400 28px "Do Hyeon",sans-serif;color:#fff;text-align:center;text-shadow:0 2px 0 rgba(150,60,0,.6);margin-top:-8%}
.brand small{display:block;font:700 12px "Noto Sans KR",sans-serif;letter-spacing:.3em;opacity:.9}
.barcode{position:absolute;left:30%;right:10%;bottom:12%;height:22%;background:repeating-linear-gradient(90deg,#fff 0 3px,transparent 3px 6px,#fff 6px 7px,transparent 7px 11px);border-radius:3px}
.pk-h{position:absolute;top:50%;left:11%;width:46px;height:70px;transform:translate(-50%,-50%);background:#fff;border-radius:24px 10px 10px 24px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.45);pointer-events:none;animation:nudge 1.6s ease-in-out infinite}
.pk.moved .pk-h,.pk.done .pk-h{animation:none}
.pk.done .pk-h{display:none}
@keyframes nudge{0%,100%{margin-left:0}50%{margin-left:7px}}
.cntline{text-align:center;color:#fff;font:400 20px "Do Hyeon",sans-serif;margin:6px 0 12px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.obtns{display:flex;gap:12px;margin:12px 0}
.obtns button{flex:1;padding:14px;border-radius:24px;font-size:16px}
.yel{background:linear-gradient(#e8e23a,#b8b312);color:#262300;box-shadow:0 3px 0 #7d7a0a}
.grn{background:linear-gradient(#76e03a,#3da012);color:#0c2a00;box-shadow:0 3px 0 #276b08}
.rchips{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 6px}
.rchip{min-width:64px;padding:12px 10px;text-align:center;border-radius:12px;font:400 30px/1 "Do Hyeon",sans-serif;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.3)}
.rchip.t1{color:#ffd84a;border-color:#ffb02e;box-shadow:0 0 14px rgba(255,140,30,.7)}
.rchip.t2{color:#cdb8ff}
.rchip.t3{color:#f4ea60}
.rchip small{font-size:.5em}
@media (prefers-reduced-motion:reduce){.pk-h,.pk.done .letter,.pk.done.t1 .glow{animation:none}.pk.done .letter{opacity:1;transform:none}.tk{transition:none}}
/* ===== v2.7 ===== */
.tk .lg{position:absolute;left:55%;top:14%;width:17%;aspect-ratio:1;transform:translateX(-50%) rotate(45deg);background:#1e2a78;border:1.5px solid #fff;border-radius:2px}
.tk.flip{background:linear-gradient(#4a4e6a,#2f3250);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18),0 2px 4px rgba(0,0,0,.5);cursor:default;display:grid;place-items:center;font:400 22px/1 "Do Hyeon",sans-serif}
.tk.flip::before,.tk.flip::after{display:none}
.tk.flip{display:flex;align-items:center;justify-content:center}
.tk.flip small{font-size:.5em;margin-left:1px;align-self:flex-end;padding-bottom:3px}
.tk.flip.t1{color:#ffd84a;text-shadow:0 0 8px rgba(255,120,20,.9)}
.tk.flip.t2{color:#cdb8ff}
.tk.flip.t3{color:#f4ea60}
.pk-face{display:block}
.pk-face .logo{position:absolute;left:50%;top:9%;width:34%;transform:translateX(-50%);filter:drop-shadow(0 2px 2px rgba(120,50,0,.5))}
.pk-face .barcode{left:50%;right:auto;width:54%;transform:translateX(-50%);bottom:10%;height:24%;background:#fff;border-radius:4px;padding:0;position:absolute;overflow:hidden}
.pk-face .barcode::before{content:"";position:absolute;inset:14% 8%;background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px,#222 4px 7px,transparent 7px 9px,#222 9px 10px,transparent 10px 13px)}
.letter{opacity:1;transform:none;filter:brightness(.7)}
.pk.done .letter{filter:none;animation:pop .65s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.28)}100%{transform:scale(1)}}
.pk.done .glow{animation:burst 1s ease-out}
.t1{--c1:255,140,30;--c2:255,90,0}.t2{--c1:150,120,255;--c2:100,70,255}.t3{--c1:255,235,90;--c2:220,190,30}
@keyframes burst{0%{opacity:.95;width:10px;height:10px;box-shadow:0 0 0 0 rgba(var(--c1),.9),0 0 30px 10px rgba(var(--c2),.8)}100%{opacity:0;width:240px;height:240px;box-shadow:0 0 60px 20px rgba(var(--c1),0)}}
.pk.done.t1{animation:shake .45s}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
.pkfx{position:absolute;inset:0;pointer-events:none;z-index:3}
.pkfx i{position:absolute;left:50%;top:58%;border-radius:50%;animation:fly .95s ease-out forwards}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:20;opacity:0;background:radial-gradient(circle at 50% 40%,rgba(255,220,120,.85),rgba(255,120,20,.35) 45%,transparent 70%)}
#flash.on{animation:fl .7s ease-out}
@keyframes fl{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.pk.done.t1,#flash.on,.pkfx i{animation:none}.pkfx{display:none}}
/* ===== v2.7 ===== */
html{touch-action:manipulation}
.kind{position:relative;display:flex;align-items:flex-end;min-height:108px;padding:16px;color:#fff;border:1.5px solid rgba(255,255,255,.35);background-size:cover;background-position:center 30%;background-color:#14102a;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.kind b{font-size:28px;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.kind[data-go="ichiban"]{background-image:linear-gradient(0deg,rgba(8,6,20,.8),rgba(8,6,20,.1) 70%),url(bg/btn1.jpg)}
.kind[data-go="jache"]{background-image:linear-gradient(0deg,rgba(8,6,20,.8),rgba(8,6,20,.1) 70%),url(bg/btn2.jpg);background-position:center 35%}
.kind[data-go="fortune"]{background-image:linear-gradient(0deg,rgba(8,6,20,.8),rgba(8,6,20,.1) 70%),url(bg/btn3.jpg);background-position:center 40%}
.pkfx{filter:drop-shadow(0 0 4px rgba(255,255,255,.9))}
.pkfx .sp{position:absolute;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);transform:translate(-50%,-50%);animation:tw .9s ease-out forwards}
@keyframes tw{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}35%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(25deg)}100%{opacity:0;transform:translate(-50%,-72%) scale(.3) rotate(70deg)}}
</style>



</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i></div><div class="bgshade" aria-hidden="true"></div>
<main>
<header class="top">
  <h1>쿠지 스캐너 <small class="ver">v2.7</small></h1>
  <button class="icon" id="homeBtn" aria-label="홈으로" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>
  </button>
</header>

<details class="card" id="keybox">
  <summary>API 키 설정</summary>
  <p class="hint">키는 이 폰의 브라우저에만 저장돼요. 코드나 GitHub에는 절대 넣지 마세요.</p>
  <input type="password" id="key" placeholder="sk-ant-..." autocomplete="off" autocapitalize="off">
  <div class="keybtns"><button id="saveKey">저장</button><button id="delKey">삭제</button></div>
</details>

<!-- 홈 -->
<section id="home">
  <p class="sub">무엇을 할까요?</p>
  <button class="kind" data-go="ichiban"><b>이치방쿠지</b></button>
  <button class="kind" data-go="jache"><b>자체쿠지</b></button>
  <button class="kind" data-go="fortune"><b>오늘의 운세</b></button>
  <button class="linkbtn" id="keyEdit">API 키 변경</button>
</section>

<!-- 이치방쿠지 / 자체쿠지 분석 -->
<section id="scan" hidden>
  <h2 id="scanTitle"></h2>
  <p class="sub">회수 부착표를 찍으면 남은 상품과 확률을 계산해요.</p>
  <div class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*" capture="environment">
      <span id="dropText">회수 부착표 사진 찍기 · 선택하기</span>
    </label>
    <button class="go" id="go" disabled>사진 분석하기</button>
    <label class="acc"><input type="checkbox" id="acc"> 정밀 모드 (Sonnet · 느리지만 더 정확)</label>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </div>
  <div id="out"></div>
</section>
<!-- 오늘의 운세 -->
<section id="fortune" hidden>
  <!-- 1) 횟수 선택 -->
  <div id="fCount" class="glass fcount">
    <h2>참여 횟수를 정해주세요.</h2>
    <p class="hint2">최대 5개까지 고를 수 있어요.<br>무료로 즐기는 모의쿠지예요.</p>
    <div class="cnt">
      <button class="qbtn" data-q="1" aria-label="1개로 설정">1</button>

/* ---------- 사진 ---------- */
// 전체 사진(이미지 1) + 아래쪽 60% 확대(이미지 2): 작은 라벨을 더 또렷하게 보내기 위함
async function prepare(file,mode){
  const b=await createImageBitmap(file);
  const toBlob=c=>new Promise(r=>c.toBlob(r,"image/jpeg",.82));
  const cv=(sy,sh)=>{const k=Math.min(mode==="ichiban"?1.6:2,1568/Math.max(b.width,sh));
    const c=document.createElement("canvas");c.width=Math.round(b.width*k);c.height=Math.round(sh*k);
    c.getContext("2d").drawImage(b,0,sy,b.width,sh,0,0,c.width,c.height);return c};
  const full=cv(0,b.height);
  if(mode==="ichiban"){                       // 전체 + 위쪽 55% + 아래쪽 58% (원본 해상도로 잘라서 작은 라벨을 또렷하게)
    const th=Math.round(b.height*0.55),sy=b.height-Math.round(b.height*0.58);
    return Promise.all([toBlob(full),toBlob(cv(0,th)),toBlob(cv(sy,b.height-sy))]);
  }
  const sy=Math.round(b.height*0.4);           // 자체쿠지: 전체 + 아래쪽 60%
  return Promise.all([toBlob(full),toBlob(cv(sy,b.height-sy))]);
}
const toB64=b=>new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(String(f.result).split(",")[1]);f.onerror=no;f.readAsDataURL(b)});

$("file").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  S.tiers=[];S.cut=-1;$("out").innerHTML="";say("");
  try{
    S.imgs=await prepare(f,MODE);
    $("dropText").innerHTML='<img alt="촬영한 회수 부착표" src="'+URL.createObjectURL(S.imgs[0])+'">';
    $("go").disabled=false;$("go").click();
  }catch(_){say("사진을 읽지 못했어요. 다른 사진으로 다시 시도해 주세요.",true)}
});

/* ---------- 제일복권 인식 ---------- */
const PROMPT_ICHIBAN=`이 사진은 일번쿠지(一番くじ, 이치방쿠지)의 회수 부착표입니다. 이미지가 세 장 주어집니다. 이미지 1은 사진 전체, 이미지 2는 같은 사진의 위쪽 55%를 확대한 것, 이미지 3은 아래쪽 58%를 확대한 것입니다(가운데가 겹칩니다). 같은 등수가 여러 이미지에 나오면 가장 선명한 이미지를 기준으로 읽으세요.
분석 대상은 사진 한가운데에 가장 크게 찍힌 판 하나입니다. 가장자리에 걸친 옆 판(다른 쿠지)은 완전히 무시하세요. 라스트원(ラストワン賞)은 제외하세요.
■ 판의 구조
- 등수(A, B, C…)마다 티켓 한 장당 칸(흰색·노랑·주황 탭)이 하나씩 이어진 줄이 있고, 칸마다 번호가 인쇄되어 있습니다. 한 등수의 줄이 두 줄 이상일 수 있습니다.
- 티켓이 팔릴 때마다 그 등수의 알파벳(A, B, E 등)이 큼직하게 찍힌 검은 스텁이 칸 위에 붙어 번호를 가립니다. 스텁은 기와처럼 겹쳐 있고 줄의 왼쪽에서부터 붙습니다. 스텁이 덮지 않은 칸이 아직 안 팔린 티켓입니다.
- 번호 방식이 두 가지입니다(한 판 안에서는 모두 같습니다).
  (가) countdown: 칸에 "あと N枚"(N장 남음)가 적혀 있고 왼쪽에서 오른쪽으로 갈수록 숫자가 줄어듭니다(예: 10 9 8 … 1). 스텁이 큰 번호부터 가리므로, 보이는 라벨 중 가장 큰 N이 남은 수량입니다.
  (나) ordinal: 칸에 "N枚目"(N번째 장)이 적혀 있고 왼쪽에서 오른쪽으로 갈수록 숫자가 늘어납니다(예: 7 8 9 10). 스텁이 작은 번호부터 가리므로, 보이는 라벨의 (가장 큰 번호 − 가장 작은 번호 + 1)이 남은 수량입니다.
■ 읽을 것(등수마다)
- first_label: 스텁에 가려지지 않고 보이는 번호 라벨 중 "읽는 순서(윗줄부터, 각 줄은 왼쪽에서 오른쪽)로 가장 먼저 나오는 번호"
- last_label: 같은 순서로 "가장 마지막에 나오는 번호"
- stubs: 그 등수 줄에 붙어 있는 검은 스텁 개수(겹쳐 있어도 알파벳 글자 하나를 1개로 셉니다). ordinal 판에서만 필요하고, 자신 없으면 null
- open_slots: 스텁에 덮이지 않은 칸이 하나라도 보이면 true
- ended: 그 등수 옆에 빨간 終了 스티커가 붙어 있으면 true
예시(번호 읽기):
- countdown 판의 E 줄: 스텁 몇 장이 높은 번호를 가리고 "あと10枚 9 8 7 / 6 5 4 3 / 2 1"이 보이면 first_label 10, last_label 1 (남은 10장).
- countdown 판에서 큰 그림 옆 주황 탭에 "あと2枚"와 "あと1枚"가 보이면 first_label 2, last_label 1. "あと1枚"만 보이면 둘 다 1.
- ordinal 판의 F 줄: 스텁 F가 6장 붙어 있고 "7枚目 8 9 10"이 보이면 first_label 7, last_label 10, stubs 6 (남은 4장).
- ordinal 판의 H 줄이 두 줄이고 윗줄이 스텁에 완전히 덮이고 아랫줄에 "16枚目 17 … 22"만 보이면 first_label 16, last_label 22.
- 스텁이 줄을 완전히 덮어 번호가 하나도 안 보이면 first_label과 last_label은 null, open_slots는 false(전부 팔림).
■ 주의
- 번호는 칸 안에 인쇄된 작은 숫자입니다. 펜으로 쓴 손글씨(가격, 메모, 번호 범위), 상품 설명, 사진 위 워터마크 글자는 번호가 아닙니다.
- 스텁 가장자리에 반쯤 가려진 번호는 이웃한 번호의 규칙(1씩 증가/감소)으로 판단하세요.
- 먼저 board_title에 판 제목을, numbering에 번호 방식(countdown/ordinal)을 정하세요. all_tiers에는 보이는 모든 등수 글자를 위에서 아래, 왼쪽에서 오른쪽 순서로 빠짐없이 적고, tiers에는 all_tiers의 모든 등수를 하나씩 채우세요.
결과는 report 도구로 제출하세요.`;

const TOOL_ICHIBAN={name:"report",description:"판의 번호 방식과 등수별 보이는 번호 라벨을 제출한다",input_schema:{type:"object",
  properties:{board_title:{type:"string"},numbering:{type:"string",enum:["countdown","ordinal"]},
  all_tiers:{type:"array",items:{type:"string"}},
  tiers:{type:"array",items:{type:"object",properties:{id:{type:"string"},
    first_label:{type:["integer","null"]},last_label:{type:["integer","null"]},
    stubs:{type:["integer","null"]},open_slots:{type:"boolean"},ended:{type:"boolean"}},
    required:["id","first_label","last_label","stubs","open_slots","ended"]}}},
  required:["board_title","numbering","all_tiers","tiers"]}};

async function askClaude(key,imgs,prompt,tool){
  const b64s=await Promise.all(imgs.map(toB64));
  const model=$("acc").checked?MODEL_ACC:MODEL_FAST;
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),40000);
  const t0=Date.now(),tick=setInterval(()=>say("분석하는 중이에요… "+Math.round((Date.now()-t0)/1000)+"초"),500);
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",signal:ctl.signal,
      headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model,max_tokens:1500,tools:[tool],tool_choice:{type:"tool",name:tool.name},
        messages:[{role:"user",content:[...b64s.map(data=>({type:"image",source:{type:"base64",media_type:"image/jpeg",data}})),{type:"text",text:prompt}]}]})
    });
    if(!res.ok){
      let m="";try{m=(await res.json()).error.message}catch(_){}
      if(res.status===401)throw new Error("API 키가 올바르지 않아요");
      if(res.status===429)throw new Error("요청이 너무 많아요. 잠시 후 다시 시도해 주세요");
      if(res.status===529)throw new Error("서버가 바빠요. 잠시 후 다시 시도해 주세요");
      throw new Error("["+model+"] "+(m||("오류 "+res.status)));
    }
    const d=await res.json();
    const tu=(d.content||[]).find(c=>c.type==="tool_use");
    if(!tu||!tu.input||!Array.isArray(tu.input.tiers)){
      const txt=(d.content||[]).map(c=>c.text||"").join("").slice(0,80);
      throw new Error("결과를 읽지 못했어요 ("+(d.stop_reason||"?")+") "+txt);
    }
    say("분석 완료 ("+model+" · "+((Date.now()-t0)/1000).toFixed(1)+"초). 숫자가 틀렸다면 아래에서 고칠 수 있어요.");
    return tu.input;
  }catch(e){
    if(e.name==="AbortError")throw new Error("40초가 지나 중단했어요. 다시 시도해 주세요");
    throw e;
  }finally{clearTimeout(timer);clearInterval(tick)}
}

function parseIchiban(r){
  const T=(r.tiers||[]).filter(x=>!LASTRE.test(String(x.id)));
  const num=v=>{const n=Math.round(Number(v));return v!==null&&v!==undefined&&Number.isFinite(n)&&n>0?n:null};
  // 번호 방식: 등수들의 (첫 라벨 → 끝 라벨) 방향으로 판 전체를 투표해 정한다. 모델이 말한 방식은 동점일 때만 사용
  let down=0,up=0;
  T.forEach(x=>{const a=num(x.first_label),b=num(x.last_label);if(a&&b){if(a>b)down++;else if(a<b)up++}});
  let style=r.numbering==="ordinal"?"ordinal":"countdown";
  if(down>up)style="countdown";else if(up>down)style="ordinal";
  const t=T.map(x=>{
    const a=num(x.first_label),b=num(x.last_label),st=num(x.stubs)!==null?num(x.stubs):(Number(x.stubs)===0?0:null);
    let rem=0,warn="",info="";
    if(a||b){
      const hi=Math.max(a||0,b||0),lo=Math.min(a||hi,b||hi);
      if(style==="countdown"){
        rem=hi;info="보이는 번호 "+hi+(lo<hi?" → "+lo:"");
        if(lo>2)warn="번호가 1 근처까지 이어지지 않아요 (가장 작은 번호 "+lo+")";
      }else{
        rem=hi-lo+1;info="보이는 번호 "+lo+(hi>lo?" ~ "+hi:"");
        if(st!==null){info+=" · 스텁 "+st+"개";if(hi-st!==rem)warn="스텁 수로 계산하면 "+Math.max(0,hi-st)+"장 (번호 기준 "+rem+"장) — 확인해 주세요"}
      }
    }else{
      if(x.open_slots){rem=1;warn="빈 칸은 보이는데 번호를 못 읽었어요. 1장으로 가정했어요"}
      else{rem=0;info=st!==null?"전부 가려짐 · 스텁 "+st+"개":"전부 가려짐"}
    }
    if(x.ended&&rem>0)warn=(warn?warn+" · ":"")+"終了 스티커가 있는데 빈 칸이 보여요 (종류별 종료일 수 있어요)";
    return{id:String(x.id),remaining:rem,info,warn};
  });
  const order=(r.all_tiers||[]).map(String).filter(id=>!LASTRE.test(id));
  const miss=order.filter(id=>!t.some(x=>x.id===id));
  miss.forEach(id=>t.push({id,remaining:0,info:"",warn:"읽지 못했어요. + − 로 직접 입력해 주세요"}));
  if(order.length)t.sort((a,b)=>{const i=order.indexOf(a.id),j=order.indexOf(b.id);return (i<0?99:i)-(j<0?99:j)});
  return t;
}

const PROMPT_JACHE=`이 사진은 쿠지 가게의 회수 부착표입니다(가게가 직접 운영하는 자체쿠지 판). 이미지가 두 장 주어집니다. 이미지 1은 사진 전체, 이미지 2는 같은 사진의 아래쪽 60%를 확대한 것입니다. 작은 번호와 스티커는 이미지 2에서 확인하세요.
구조:
- 등수(A, B, C…)마다 티켓 한 장당 칸이 하나씩 있고, 칸에는 번호가 인쇄되어 있습니다("1", "2", "1枚目", "あと N枚" 등).
- 티켓이 팔리면 사장님이 칸 위에 스티커를 붙여 칸을 가립니다. 스티커 종류는 판마다 다릅니다: 빨간 終了 스티커, 팔린 티켓 번호를 손으로 쓴 흰 라벨(예: 27, 44, 80), 등수 알파벳이 찍힌 검은 스텁. 어떤 종류든 "팔린 칸 1개"입니다. 스텁을 칸 위가 아니라 별도 줄에 쌓아 두는 판도 있는데, 그 경우 스텁 줄은 칸을 가리지 않으니 stickers에 세지 말고 인쇄된 번호 칸만 읽으세요.
- 번호가 큰 칸부터 가리는 가게도 있고 작은 칸부터 가리는 가게도 있습니다. 그래서 가려진 칸이 아니라 "가려지지 않은 칸"과 "스티커 개수"를 읽어야 합니다.
- 등수 글자 근처에 사장님이 펜으로 쓴 "티켓 번호 범위"(예: "10-33", "3", "8~25")가 있는 판이 많습니다. 이 범위의 양 끝이 그 등수 전체 티켓의 번호입니다.
먼저 all_tiers에 보드에 보이는 모든 등수 글자를 위에서 아래, 왼쪽에서 오른쪽 순서로 빠짐없이 적으세요(라스트원 제외). 그다음 all_tiers의 모든 등수마다 tiers에 항목을 하나씩 만드세요.
각 등수 항목:
- written_lo, written_hi: 그 등수의 손글씨 티켓 번호 범위의 양 끝. 숫자 하나면 둘 다 같은 값. 범위가 없거나 읽을 수 없으면 둘 다 null
- stickers: 그 등수의 칸 위에 붙은 스티커 개수(빨간 終了, 번호 라벨, 알파벳 스텁 모두 포함). 겹쳐 붙은 라벨도 하나씩 세세요. 없으면 0
- open_lo, open_hi: 스티커로 가려지지 않고 보이는 칸의 "인쇄된 칸 번호" 중 가장 작은 번호와 가장 큰 번호(칸이 여러 줄이나 블록에 걸쳐 있으면 전체에서). 스티커에 손으로 쓴 번호와 손글씨 범위는 칸 번호가 아닙니다. 보이는 칸이 없으면 둘 다 null
- open_slots: 가려지지 않은 칸이 하나라도 보이면 true
예시:
- F: 손글씨가 "10-33", 윗줄 칸 1~12 중 1~3번이 흰 라벨 3장으로 덮이고 4~12번과 아랫줄 13~24번이 보이면 written_lo 10, written_hi 33, stickers 3, open_lo 4, open_hi 24.
- B: 손글씨가 "3"이고 칸 1개가 비어 있으면 written_lo 3, written_hi 3, stickers 0, open_lo 1, open_hi 1.
- 칸이 모두 가려졌으면 open_lo와 open_hi는 null, open_slots는 false.
- "あと N枚" 방식 판은 보이는 칸의 N 중 가장 작은 값과 가장 큰 값을 open_lo, open_hi로 쓰세요.
- 한 줄에 칸이 이어지다 다른 줄로 넘어가는 경우(예: 윗줄 1~12, 아랫줄 13~24)에도 전체 범위로 적으세요.
- 옆 포스터(다른 쿠지)는 무시하세요. 표 바깥 안내 문구 옆의 큰 빨간 終了는 세지 마세요.
결과는 report 도구로 제출하세요.`;

const TOOL_JACHE={name:"report",description:"등수별 티켓 범위, 스티커 개수, 빈 칸 범위를 제출한다",input_schema:{type:"object",
  properties:{all_tiers:{type:"array",items:{type:"string"}},
  tiers:{type:"array",items:{type:"object",properties:{id:{type:"string"},
    written_lo:{type:["integer","null"]},written_hi:{type:["integer","null"]},
    stickers:{type:"integer"},
    open_lo:{type:["integer","null"]},open_hi:{type:["integer","null"]},
    open_slots:{type:"boolean"}},required:["id","written_lo","written_hi","stickers","open_lo","open_hi","open_slots"]}}},
  required:["all_tiers","tiers"]}};

// 남은 수량 = (손글씨 범위의 전체 − 스티커 수) 와 (빈 칸 번호 범위) 두 가지로 계산해 서로 확인
function parseJache(r){
  const t=(r.tiers||[]).map(x=>{
    const wl=Number(x.written_lo),wh=Number(x.written_hi),ol=Number(x.open_lo),oh=Number(x.open_hi);
    const st=Number.isFinite(Number(x.stickers))?Number(x.stickers):null;
    const total=(wl>0&&wh>=wl)?wh-wl+1:null;
    const e1=(ol>0&&oh>=ol)?oh-ol+1:null;                          // 보이는 칸 번호 기준
    const e2=(total!==null&&st!==null&&st<=total)?total-st:null;   // 전체 − 스티커 기준
    let rem,warn="";
    if(e1!==null&&e2!==null){
      if(Math.abs(e1-e2)<=1)rem=e2;   // 1 차이는 판에 쓰이지 않는 칸이 남는 경우가 있어 손글씨 범위를 우선
      else{rem=e1;warn="서로 달라요 (빈 칸 번호 기준 "+e1+" / 전체−스티커 기준 "+e2+")"}
    }else if(e2!==null)rem=e2;
    else if(e1!==null)rem=e1;
    else rem=x.open_slots?1:0;
    const parts=[];
    if(total!==null)parts.push("전체 "+total);
    if(st!==null)parts.push("스티커 "+st+"개");
    if(e1!==null)parts.push("빈 칸 "+ol+"~"+oh);
    return{id:String(x.id),remaining:rem,info:parts.join(" · "),warn};
  }).filter(x=>!LASTRE.test(x.id));
  const order=(r.all_tiers||[]).map(String).filter(id=>!LASTRE.test(id));
  const miss=order.filter(id=>!t.some(x=>x.id===id));
  miss.forEach(id=>t.push({id,remaining:0,info:"",warn:"읽지 못했어요. + − 로 직접 입력해 주세요"}));
  if(order.length)t.sort((a,b)=>{const i=order.indexOf(a.id),j=order.indexOf(b.id);return (i<0?99:i)-(j<0?99:j)});
  return t;
}

const CFG={
  ichiban:{title:"이치방쿠지 분석",prompt:PROMPT_ICHIBAN,tool:TOOL_ICHIBAN,parse:parseIchiban},
  jache:{title:"자체쿠지 분석",prompt:PROMPT_JACHE,tool:TOOL_JACHE,parse:parseJache}
};

$("go").addEventListener("click",async()=>{

    S.tiers=t;S.cut=-1;render();

});

/* ---------- 결과 화면 ---------- */
function render(){
  const T=S.tiers,cut=S.cut,sum=a=>a.reduce((s,t)=>s+t.remaining,0),rem=sum(T);
  let h='<section class="card"><h2>상위상은 어디까지?</h2><p class="hint">고른 등수까지 상위상으로 계산해요.</p><div class="chips">'+
    T.map((t,i)=>'<button class="chip'+(i===cut?" on":"")+'" data-cut="'+i+'">'+esc(t.id)+'</button>').join("")+'</div></section>';
  if(cut>=0){
    const rt=sum(T.slice(0,cut+1)),rl=rem-rt,p=rem?rt/rem*100:0;
    h+='<section class="card"><div class="big"><b>'+p.toFixed(1)+'%</b><span>다음 한 장에서 상위상('+esc(T[0].id)+'~'+esc(T[cut].id)+')이 나올 확률</span></div>'+
      '<div class="stats"><div><b>'+rem+'</b><span>남은 수량</span></div><div><b style="color:var(--top)">'+rt+'</b><span>상위상 남음</span></div><div><b style="color:var(--low)">'+rl+'</b><span>하위상 남음</span></div></div></section>';
  }
  h+='<section class="card"><h2>등수별 남은 수량</h2><p class="hint">읽은 값이 틀리면 + − 로 고치세요.</p>'+
    T.map((t,i)=>{
      const pc=rem?t.remaining/rem*100:0,cls=cut>=0&&i>cut?"low":"top";
      return '<div class="row '+cls+'"><div class="lt">'+esc(t.id)+'</div><div><div class="bar"><i style="width:'+pc+'%"></i></div>'+
        '<div class="meta">남은 '+t.remaining+'장 · 한 장 뽑을 때 '+pc.toFixed(1)+'%'+(t.info?' · '+esc(t.info):'')+(t.warn?'<br><span class="warn">⚠ '+esc(t.warn)+'</span>':'')+'</div></div>'+
        '<div class="step"><button data-i="'+i+'" data-d="-1" aria-label="'+esc(t.id)+' 하나 줄이기">−</button><output>'+t.remaining+'</output><button data-i="'+i+'" data-d="1" aria-label="'+esc(t.id)+' 하나 늘리기">+</button></div></div>';
    }).join("")+'</section>';
  $("out").innerHTML=h;
}
$("out").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.cut!==undefined){S.cut=+b.dataset.cut}
  else if(b.dataset.i!==undefined){const t=S.tiers[+b.dataset.i];t.remaining=Math.max(0,t.remaining+ +b.dataset.d)}
  render();
});


/* ---------- 오늘의 운세 (무료 모의 쿠지) ---------- */
const FT={A:2,B:2,C:2,D:2,E:3,F:3,G:18,H:20,I:20};         // 합계 72장 (6 × 12)
const COLS=6,ROWS=12;
const F={n:1,board:[],flip:new Set(),sel:[],idx:0,results:[]};
const tierClass=t=>"ABCD".includes(t)?"t1":"EF".includes(t)?"t2":"t3";
const rnd=n=>{const u=new Uint32Array(1);crypto.getRandomValues(u);return Math.floor(u[0]/4294967296*n)}; // 0..n-1
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function fStep(name){["fCount","fBoard","fOpen","fResult"].forEach(id=>$(id).hidden=id!==name);window.scrollTo(0,0)}

function newRound(){
  const tiers=[];Object.entries(FT).forEach(([k,c])=>{for(let i=0;i<c;i++)tiers.push(k)});
  F.board=shuffle(tiers);                                         // 자리별 상(알파벳)을 무작위로 확정
  const k=10+rnd(21);                                             // 10~30장은 미리 뒤집혀 있음
  F.flip=new Set(shuffle([...Array(F.board.length).keys()]).slice(0,k));
  F.sel=[];F.idx=0;F.results=[];
}
function startFortune(){newRound();stopSparks();F.n=1;$("cNum").textContent=F.n;fStep("fCount");show("fortune")}
function setN(n){F.n=Math.max(1,Math.min(5,n));$("cNum").textContent=F.n}
$("cMinus").addEventListener("click",()=>setN(F.n-1));
$("cPlus").addEventListener("click",()=>setN(F.n+1));
document.querySelectorAll(".qbtn").forEach(b=>b.addEventListener("click",()=>setN(+b.dataset.q)));
$("cOk").addEventListener("click",buildBoard);

function buildBoard(){
  F.sel=[];F.idx=0;F.results=[];
  $("grid").innerHTML=F.board.map((t,i)=>F.flip.has(i)
    ?'<div class="tk flip '+tierClass(t)+'" role="img" aria-label="이미 열린 쿠폰 '+(i+1)+'번: '+t+'상">'+t+'<small>상</small></div>'
    :'<button class="tk" data-i="'+i+'" aria-pressed="false" aria-label="쿠폰 '+(i+1)+'번"><b class="lg"></b><i>✓</i></button>').join("");
  updBoard();fStep("fBoard");
}
function updBoard(msg){
  document.querySelectorAll(".tk:not(.flip)").forEach(b=>{const on=F.sel.includes(+b.dataset.i);b.classList.toggle("sel",on);b.setAttribute("aria-pressed",on)});
  $("bCount").textContent=msg||(F.sel.length+"/"+F.n+"개의 쿠폰이 선택되었습니다.");
  $("bStart").disabled=F.sel.length!==F.n;
}
$("grid").addEventListener("click",e=>{
  const b=e.target.closest(".tk");if(!b||b.classList.contains("flip"))return;
  const i=+b.dataset.i,at=F.sel.indexOf(i);
  if(at>=0)F.sel.splice(at,1);                                  // 이미 고른 것 → 취소
  else if(F.sel.length<F.n)F.sel.push(i);
  else{updBoard("최대 "+F.n+"개까지 고를 수 있어요. 하나를 눌러 취소해 주세요.");return}
  updBoard();
});
$("bRand").addEventListener("click",()=>{                        // 누를 때마다 처음부터 다시 무작위로 뽑음
  const all=[...Array(F.board.length).keys()].filter(i=>!F.flip.has(i));   // 이미 뒤집힌 것은 제외
  F.sel=shuffle(all).slice(0,F.n);updBoard();
});
$("bStart").addEventListener("click",()=>{F.idx=0;F.results=[];loadTicket();fStep("fOpen")});

/* 뜯기 */
const pk=$("pk"),face=$("pkFace"),hdl=$("pkH");
let P=0,drag=null,isDone=false,anim=0;
let sparkT=0;
function spawnSpark(){
  const fx=$("pkFx");if(fx.children.length>40)return;
  for(let k=0;k<2;k++){
    const e=document.createElement("span");e.className="sp";
    const ex=P*106-3,x=Math.random()<.5?ex-10+Math.random()*20:-8+Math.random()*116,y=-14+Math.random()*128,z=7+Math.random()*12;
    e.style.cssText="left:"+x.toFixed(1)+"%;top:"+y.toFixed(1)+"%;width:"+z.toFixed(1)+"px;height:"+z.toFixed(1)+"px;animation-delay:"+(Math.random()*.15).toFixed(2)+"s";
    e.addEventListener("animationend",()=>e.remove());fx.appendChild(e);
  }
}
function startSparks(){if(!sparkT)sparkT=setInterval(spawnSpark,80)}
function stopSparks(){clearInterval(sparkT);sparkT=0}
function setP(p){
  P=Math.max(0,Math.min(1,p));
  if(P<=0.001)face.style.clipPath="none";
  else{
    const ex=P*106-3,N=14,pts=[];
    for(let i=0;i<=N;i++){const y=i/N*100,dx=(i%2?1.4:-1.4)+(y-50)*0.06;pts.push((ex+dx).toFixed(2)+"% "+y.toFixed(1)+"%")}
    face.style.clipPath="polygon("+pts.join(",")+",100% 100%,100% 0)";
  }
  hdl.style.left=Math.min(96,Math.max(11,P*106+5))+"%";
  if(P>0.02){pk.classList.add("moved");if(!isDone)startSparks()}
}
function loadTicket(){
  cancelAnimationFrame(anim);stopSparks();$("pkFx").innerHTML="";
  const t=F.board[F.sel[F.idx]];
  pk.className="pk "+tierClass(t);
  $("pkLetter").innerHTML=t+"<small>상</small>";
  isDone=false;drag=null;setP(0);
  $("oCount").textContent=(F.idx+1)+" / "+F.n;
  $("oBtns").hidden=false;$("oNext").hidden=true;
}
function finish(){
  if(isDone)return;isDone=true;stopSparks();setP(1);
  pk.classList.add("done");burst(tierClass(F.board[F.sel[F.idx]]));
  F.results.push(F.board[F.sel[F.idx]]);
  $("oBtns").hidden=true;
  const last=F.idx>=F.n-1;
  $("oNext").textContent=last?"결과 보기":"다음 쿠폰";$("oNext").hidden=false;$("oNext").focus({preventScroll:true});
}
function burst(tc){
  const fx=$("pkFx");fx.innerHTML="";
  const n=tc==="t1"?34:tc==="t2"?20:12;
  const cols={t1:["#ffd84a","#ff7a1a","#fff3a0","#ff4a1a"],t2:["#cdb8ff","#7a5cff","#ffffff"],t3:["#f4ea60","#fff6a0","#ffe14a"]}[tc];
  const R=tc==="t1"?[90,210]:tc==="t2"?[70,150]:[55,115];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,d=R[0]+Math.random()*(R[1]-R[0]),z=4+Math.random()*(tc==="t1"?7:5),e=document.createElement("i");
    e.style.cssText="--dx:"+(Math.cos(a)*d).toFixed(0)+"px;--dy:"+(Math.sin(a)*d).toFixed(0)+"px;width:"+z.toFixed(1)+"px;height:"+z.toFixed(1)+"px;background:"+cols[i%cols.length]+";box-shadow:0 0 6px "+cols[i%cols.length]+";animation-delay:"+(Math.random()*0.12).toFixed(2)+"s";
    fx.appendChild(e);
  }
  if(tc==="t1"){const f=$("flash");f.classList.remove("on");void f.offsetWidth;f.classList.add("on")}
  if(navigator.vibrate)try{navigator.vibrate(tc==="t1"?[60,40,90]:30)}catch(_){}
}
function autoPeel(ms){
  cancelAnimationFrame(anim);const p0=P,t0=performance.now(),d=Math.max(250,ms*(1-p0));
  (function step(t){const k=Math.min(1,(t-t0)/d),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;setP(p0+(1-p0)*e);k<1?anim=requestAnimationFrame(step):finish()})(t0);
}
pk.addEventListener("pointerdown",e=>{if(isDone)return;cancelAnimationFrame(anim);drag={x:e.clientX,p:P};pk.setPointerCapture(e.pointerId)});
pk.addEventListener("pointermove",e=>{if(!drag||isDone)return;const np=drag.p+(e.clientX-drag.x)/(pk.clientWidth*0.8);if(np>P)setP(np)});
const endDrag=()=>{if(!drag)return;drag=null;if(P>0.015&&!isDone)autoPeel(450)};
pk.addEventListener("pointerup",endDrag);pk.addEventListener("pointercancel",endDrag);
$("oOpen").addEventListener("click",()=>autoPeel(1400));
$("oAuto").addEventListener("click",()=>{                         // 남은 쿠폰을 한 번에 모두 오픈
  cancelAnimationFrame(anim);
  while(F.results.length<F.n){F.results.push(F.board[F.sel[F.results.length]])}
  showResult();
});
$("oNext").addEventListener("click",()=>{if(F.idx>=F.n-1)showResult();else{F.idx++;loadTicket()}});

function showResult(){
  $("rChips").innerHTML=F.results.map(t=>'<div class="rchip '+tierClass(t)+'">'+t+'<small>상</small></div>').join("");
  const top=F.results.filter(t=>"ABCD".includes(t)).length;
  $("rMsg").textContent=top?("A~D상이 "+top+"개 나왔어요! 오늘은 운이 좋네요."):"이번에는 아쉬웠어요. 다시 도전해 보세요.";
  fStep("fResult");
}
$("rAgain").addEventListener("click",()=>{newRound();fStep("fCount")});
$("rHome").addEventListener("click",()=>{show("home")});

syncKey("home");
